# Render deployment configuration for the backend service.
# Render reads this file from the repository root.
# Set these environment variables in the Render dashboard:
#   DATABASE_URL  — Your Neon PostgreSQL connection string
#   FRONTEND_URL  — Your deployed Vercel frontend URL
#   NODE_ENV      — production
#   PORT          — Render sets this automatically; do not override it

services:
  - type: web
    name: shipment-tracker-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run db:generate && npm run build
    startCommand: npm run db:migrate && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false        # Set this in the Render dashboard — never commit secrets
      - key: FRONTEND_URL
        sync: false        # Set this in the Render dashboard after Vercel deploy
